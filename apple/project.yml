name: DailyRoutineApple
options:
  bundleIdPrefix: com.bojangles4x4
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.26.0"
    CURRENT_PROJECT_VERSION: "28"
schemes:
  DailyRoutine:
    build:
      targets:
        DailyRoutine: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DailyRoutineTests
  DailyRoutineWatch:
    build:
      targets:
        DailyRoutineWatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DailyRoutineWatchUITests
  DailyRoutineAgent:
    build:
      targets:
        DailyRoutineAgent: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DailyRoutineAgentTests
  DailyRoutineMessagesImporter:
    build:
      targets:
        DailyRoutineMessagesImporter: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DailyRoutineMessagesImporterTests
targets:
  DailyRoutine:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
        excludes:
          - WidgetSnapshotStore.swift
      - path: iOSWidgetShared
      - path: ../index.html
        buildPhase: resources
      - path: ../styles.css
        buildPhase: resources
      - path: ../app.js
        buildPhase: resources
      - path: ../sync-core.js
        buildPhase: resources
      - path: ../sync-cloud.js
        buildPhase: resources
      - path: ../manifest.webmanifest
        buildPhase: resources
      - path: ../icon-192.png
        buildPhase: resources
      - path: ../icon-512.png
        buildPhase: resources
      - path: ../privacy.html
        buildPhase: resources
      - path: ../support.html
        buildPhase: resources
      - path: ../legal.css
        buildPhase: resources
    info:
      path: Config/DailyRoutine-Info.plist
      properties:
        CFBundleDisplayName: Daily Routine
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: Daily Routine can read the health categories you choose to help summarize steps, sleep, and workouts alongside your routine.
        NSHealthUpdateUsageDescription: Daily Routine uses HealthKit only to read the health categories you choose; it does not add or modify health data.
        NSMotionUsageDescription: Daily Routine can use iPhone motion data during an active step round so your Earned Access progress updates without waiting for Apple Health to sync.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: com.bojangles4x4.DailyRoutine
            CFBundleURLSchemes:
              - dailyroutine
    entitlements:
      path: Config/DailyRoutine.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.developer.healthkit: true
        com.apple.security.application-groups:
          - group.com.bojangles4x4.DailyRoutine
    settings:
      base:
        DEVELOPMENT_TEAM: UQ7AURZ83A
        PRODUCT_BUNDLE_IDENTIFIER: com.bojangles4x4.DailyRoutine
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: DailyRoutineWatch
        embed: true
      - target: DailyRoutineActivityMonitor
        embed: true
      - target: DailyRoutineHomeWidgets
        embed: true
  DailyRoutineHomeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: iOSWidgets
      - path: iOSWidgetShared
      - path: Shared/RoutineSharedStateStore.swift
    info:
      path: Config/DailyRoutineHomeWidgets-Info.plist
      properties:
        CFBundleDisplayName: Daily Routine Widgets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/DailyRoutineHomeWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bojangles4x4.DailyRoutine
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: true
        DEVELOPMENT_TEAM: UQ7AURZ83A
        PRODUCT_BUNDLE_IDENTIFIER: com.bojangles4x4.DailyRoutine.widgets
        SKIP_INSTALL: true
        TARGETED_DEVICE_FAMILY: "1"
  DailyRoutineActivityMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: ActivityMonitor
      - path: iOS/EarnedAccessShared.swift
    info:
      path: Config/DailyRoutineActivityMonitor-Info.plist
      properties:
        CFBundleDisplayName: Earned Access Monitor
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension"
    entitlements:
      path: Config/DailyRoutineActivityMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.bojangles4x4.DailyRoutine
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: true
        DEVELOPMENT_TEAM: UQ7AURZ83A
        PRODUCT_BUNDLE_IDENTIFIER: com.bojangles4x4.DailyRoutine.activitymonitor
        SKIP_INSTALL: true
  DailyRoutineWatch:
    type: application
    platform: watchOS
    sources:
      - path: watchOS
      - path: Shared
    info:
      path: Config/DailyRoutineWatch-Info.plist
      properties:
        CFBundleDisplayName: Daily Routine
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.bojangles4x4.DailyRoutine
        WKRunsIndependentlyOfCompanionApp: false
    entitlements:
      path: Config/DailyRoutineWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bojangles4x4.DailyRoutine
    settings:
      base:
        DEVELOPMENT_TEAM: UQ7AURZ83A
        PRODUCT_BUNDLE_IDENTIFIER: com.bojangles4x4.DailyRoutine.watchkitapp
        SKIP_INSTALL: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: DailyRoutineWatchWidgets
        embed: true
  DailyRoutineWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: Config/DailyRoutineWidgets-Info.plist
      properties:
        CFBundleDisplayName: Routine Progress
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/DailyRoutineWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bojangles4x4.DailyRoutine
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: true
        DEVELOPMENT_TEAM: UQ7AURZ83A
        PRODUCT_BUNDLE_IDENTIFIER: com.bojangles4x4.DailyRoutine.watchkitapp.widgets
        SKIP_INSTALL: true
  DailyRoutineWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: Tests/WatchUITests
    dependencies:
      - target: DailyRoutineWatch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.bojangles4x4.DailyRoutine.watchuitests
        TEST_TARGET_NAME: DailyRoutineWatch
  DailyRoutineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/iOS
    dependencies:
      - target: DailyRoutine
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.bojangles4x4.DailyRoutine.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DailyRoutine.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/DailyRoutine"
        BUNDLE_LOADER: "$(TEST_HOST)"
  DailyRoutineAgent:
    type: application
    platform: macOS
    sources:
      - path: macOSAgent
    info:
      path: Config/DailyRoutineAgent-Info.plist
      properties:
        CFBundleDisplayName: Daily Routine Agent
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSCalendarsFullAccessUsageDescription: Daily Routine Agent can read calendar events you approve to find schedule patterns. It never edits your calendar.
        NSHumanReadableCopyright: "Daily Routine"
    settings:
      base:
        DEVELOPMENT_TEAM: UQ7AURZ83A
        PRODUCT_BUNDLE_IDENTIFIER: com.bojangles4x4.DailyRoutine.agent
        PRODUCT_NAME: Daily Routine Agent
        GENERATE_INFOPLIST_FILE: false
        ENABLE_APP_SANDBOX: false
        ENABLE_HARDENED_RUNTIME: true
    dependencies:
      - sdk: libsqlite3.tbd
      - sdk: EventKit.framework
      - sdk: Security.framework
      - sdk: ServiceManagement.framework
  DailyRoutineAgentTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/macOSAgent
    dependencies:
      - target: DailyRoutineAgent
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.bojangles4x4.DailyRoutine.agent.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Daily Routine Agent.app/Contents/MacOS/Daily Routine Agent"
        BUNDLE_LOADER: "$(TEST_HOST)"
  DailyRoutineMessagesImporter:
    type: application
    platform: macOS
    sources:
      - path: macOSMessagesImporter
      - path: macOSAgent/MessagesImportEnvelope.swift
    info:
      path: Config/DailyRoutineMessagesImporter-Info.plist
      properties:
        CFBundleDisplayName: Daily Routine Messages Importer
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "Daily Routine"
    settings:
      base:
        DEVELOPMENT_TEAM: UQ7AURZ83A
        PRODUCT_BUNDLE_IDENTIFIER: com.bojangles4x4.DailyRoutine.messages-importer
        PRODUCT_NAME: Daily Routine Messages Importer
        GENERATE_INFOPLIST_FILE: false
        ENABLE_APP_SANDBOX: false
        ENABLE_HARDENED_RUNTIME: true
    dependencies:
      - sdk: libsqlite3.tbd
      - sdk: ServiceManagement.framework
  DailyRoutineMessagesImporterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/macOSMessagesImporter
    dependencies:
      - target: DailyRoutineMessagesImporter
      - sdk: libsqlite3.tbd
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.bojangles4x4.DailyRoutine.messages-importer.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Daily Routine Messages Importer.app/Contents/MacOS/Daily Routine Messages Importer"
        BUNDLE_LOADER: "$(TEST_HOST)"
