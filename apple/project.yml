name: DailyRoutineApple
options:
  bundleIdPrefix: com.bojangles4x4
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.9.2"
    CURRENT_PROJECT_VERSION: "2"
schemes:
  DailyRoutine:
    build:
      targets:
        DailyRoutine: all
    run:
      config: Debug
  DailyRoutineWatch:
    build:
      targets:
        DailyRoutineWatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DailyRoutineWatchUITests
targets:
  DailyRoutine:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
      - path: ../index.html
        buildPhase: resources
      - path: ../styles.css
        buildPhase: resources
      - path: ../app.js
        buildPhase: resources
      - path: ../manifest.webmanifest
        buildPhase: resources
      - path: ../icon-192.png
        buildPhase: resources
      - path: ../icon-512.png
        buildPhase: resources
    info:
      path: Config/DailyRoutine-Info.plist
      properties:
        CFBundleDisplayName: Daily Routine
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHealthShareUsageDescription: Daily Routine can read the health categories you choose to help summarize steps, sleep, and workouts alongside your routine.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: Config/DailyRoutine.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        DEVELOPMENT_TEAM: UQ7AURZ83A
        PRODUCT_BUNDLE_IDENTIFIER: com.bojangles4x4.DailyRoutine
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: DailyRoutineWatch
        embed: true
  DailyRoutineWatch:
    type: application
    platform: watchOS
    sources:
      - path: watchOS
      - path: Shared
    info:
      path: Config/DailyRoutineWatch-Info.plist
      properties:
        CFBundleDisplayName: Daily Routine
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.bojangles4x4.DailyRoutine
        WKRunsIndependentlyOfCompanionApp: false
    entitlements:
      path: Config/DailyRoutineWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bojangles4x4.DailyRoutine
    settings:
      base:
        DEVELOPMENT_TEAM: UQ7AURZ83A
        PRODUCT_BUNDLE_IDENTIFIER: com.bojangles4x4.DailyRoutine.watchkitapp
        SKIP_INSTALL: true
    dependencies:
      - target: DailyRoutineWatchWidgets
        embed: true
  DailyRoutineWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: Config/DailyRoutineWidgets-Info.plist
      properties:
        CFBundleDisplayName: Routine Progress
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/DailyRoutineWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bojangles4x4.DailyRoutine
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: true
        DEVELOPMENT_TEAM: UQ7AURZ83A
        PRODUCT_BUNDLE_IDENTIFIER: com.bojangles4x4.DailyRoutine.watchkitapp.widgets
        SKIP_INSTALL: true
  DailyRoutineWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: Tests/WatchUITests
    dependencies:
      - target: DailyRoutineWatch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.bojangles4x4.DailyRoutine.watchuitests
        TEST_TARGET_NAME: DailyRoutineWatch
